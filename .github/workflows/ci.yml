name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python for CI tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install CI test dependencies
        run: python3 -m pip install -r .github/tests/requirements.txt

      - name: Run CI regression tests
        run: python3 -B -m unittest discover -s .github/tests -p 'test_*.py' -v

      - name: Validate JSON configs
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          paths = {Path("mcp_config.json"), Path("hooks.json")}
          for name in ("mcp_config.json", "hooks.json"):
              paths.update(Path("plugins").rglob(name))

          errors = []
          for path in sorted(paths):
              try:
                  with path.open(encoding="utf-8") as config:
                      json.load(config)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  errors.append(f"Invalid JSON config: {path} ({exc})")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"Validated {len(paths)} JSON configs")
          PY

      - name: Required files present
        run: |
          for path in README.md AGENTS.md; do
            if [ ! -s "$path" ]; then
              printf 'Required file missing or empty: %s\n' "$path" >&2
              exit 1
            fi
          done

      - name: Skill and rule manifests non-empty
        run: |
          python3 - <<'PY'
          from pathlib import Path

          errors = []
          for name in ("skills", "rules", "plugins"):
              root = Path(name)
              if not root.is_dir():
                  errors.append(f"Missing manifest directory: {root}")
                  continue
              for path in sorted(root.rglob("*.md")):
                  if path.is_dir():
                      continue
                  try:
                      content = path.read_text(encoding="utf-8")
                  except (OSError, UnicodeError) as exc:
                      errors.append(f"Unreadable manifest: {path} ({type(exc).__name__})")
                      continue
                  if not content.strip():
                      errors.append(f"Empty manifest: {path}")

          if errors:
              raise SystemExit("\n".join(errors))
          PY

  scalability-tests:
    name: Scalability tests (standard library)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Test scalability without site packages
        run: python3 -S -B -m unittest discover -s .github/tests -p 'test_scalability*.py' -v

  scalability-report:
    name: Scalability example (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Exercise synthetic campaign without providers
        run: |
          python3 -B scripts/run_scalability.py \
            --input logs/scalability/runs.jsonl \
            --space examples/scalability/space.json \
            --policy examples/scalability/policy.json \
            --runner python3 -B examples/scalability/synthetic_runner.py
          python3 -B scripts/analyze_scalability.py \
            --input logs/scalability/runs.jsonl \
            --policy examples/scalability/policy.json
          python3 -B scripts/plan_scalability.py \
            --input logs/scalability/runs.jsonl \
            --space examples/scalability/space.json \
            --policy examples/scalability/policy.json

      - name: Publish informational summary
        if: always()
        run: |
          if [ -f logs/scalability/report.md ]; then
            cat logs/scalability/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Scalability example did not produce a report; inspect job logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve example evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scalability-example
          path: |
            logs/scalability/*.json
            logs/scalability/*.jsonl
            logs/scalability/*.md
          if-no-files-found: warn
          retention-days: 14

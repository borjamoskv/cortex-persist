name: MOSKV Fleet Steward (public inventory only)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 04 * * 1'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - name: Read-only public repo scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B scripts/github_fleet_steward.py scan \
            --owner borjamoskv --scope public \
            --out "$RUNNER_TEMP/moskv-fleet-steward" --workers 2
          cat "$RUNNER_TEMP/moskv-fleet-steward/report.md" >> "$GITHUB_STEP_SUMMARY"
